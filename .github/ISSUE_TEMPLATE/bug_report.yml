name: Bug report
description: Something on the site or in the code doesn't work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: A page on earthwardai.com, or a file and command if you're running it locally.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
